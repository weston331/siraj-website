<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - الصفحة غير موجودة | سِراج الأطهار</title>
    <meta name="robots" content="noindex, follow">
    <link rel="icon" type="image/svg+xml" href="images/logo.svg">
    <link rel="alternate icon" type="image/png" href="images/logo.png">
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400;600;700&family=Amiri:wght@700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">
    <style>
        .error-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #001A3F 0%, #0D2B5E 100%);
            position: relative;
            overflow: hidden;
        }
        
        .error-glow {
            position: absolute;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(212, 175, 55, 0.2) 0%, transparent 70%);
            filter: blur(80px);
            animation: float 25s ease-in-out infinite;
        }
        
        .error-content {
            position: relative;
            z-index: 10;
            text-align: center;
            padding: 2rem;
            max-width: 600px;
        }
        
        .error-icon {
            width: 120px;
            height: 120px;
            margin: 0 auto 2rem;
            background: rgba(245, 215, 142, 0.1);
            border: 2px solid rgba(245, 215, 142, 0.3);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .error-icon .material-symbols-rounded {
            font-size: 64px;
            color: #D4AF37;
        }
        
        .error-code {
            font-size: 8rem;
            font-weight: 700;
            color: #D4AF37;
            line-height: 1;
            margin-bottom: 1rem;
            text-shadow: 0 4px 20px rgba(212, 175, 55, 0.4);
        }
        
        .error-title {
            font-family: 'Amiri', serif;
            font-size: 2.5rem;
            color: white;
            margin-bottom: 1rem;
        }
        
        .error-message {
            font-size: 1.25rem;
            color: rgba(255, 255, 255, 0.8);
            margin-bottom: 2rem;
            line-height: 1.7;
        }
        
        .error-actions {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
        }
        
        .error-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 14px 28px;
            border-radius: 12px;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.3s ease;
            font-size: 1rem;
        }
        
        .error-btn-primary {
            background: #D4AF37;
            color: #001A3F;
            box-shadow: 0 4px 16px rgba(212, 175, 55, 0.4);
        }
        
        .error-btn-primary:hover {
            background: #F5D78E;
            transform: translateY(-2px);
        }
        
        .error-btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .error-btn-secondary:hover {
            background: rgba(255, 255, 255, 0.15);
        }
    </style>
</head>
<body>
    <div class="error-page">
        <div class="error-glow" style="top: -10%; right: -10%;"></div>
        <div class="error-glow" style="bottom: -10%; left: -10%; animation-delay: 12s;"></div>
        
        <div class="error-content">
            <div class="error-icon">
                <span class="material-symbols-rounded">search_off</span>
            </div>
            
            <div class="error-code">404</div>
            
            <h1 class="error-title">الصفحة غير موجودة</h1>
            
            <p class="error-message">
                عذراً، لم نتمكن من العثور على الصفحة التي تبحث عنها.
                <br>
                ربما تكون قد تم نقلها أو حذفها.
            </p>
            
            <div class="error-actions">
                <a href="/" class="error-btn error-btn-primary">
                    <span class="material-symbols-rounded">home</span>
                    العودة للرئيسية
                </a>
                <a href="/#download" class="error-btn error-btn-secondary">
                    <span class="material-symbols-rounded">download</span>
                    تحميل التطبيق
                </a>
            </div>
        </div>
    </div>
</body>
</html>
